<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healer | Personality Assessment Test</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/quiz.css" />
</head>

<body>

  <a href="index.html" class="floating-home-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z" />
    </svg>
    <span>Home</span>
  </a>

  <!-- ================= QUIZ SCREEN ================= -->
  <main id="quizScreen" class="quiz-container">

    <!-- Sticky Progress & 5-Part Stepper Header -->
    <header class="quiz-header">
      <div class="quiz-brand-mini">
        <img src="./images/healer-logo.webp" alt="Healer Logo" class="brand-logo-small" />
        <span>Healer Assessment Engine</span>
      </div>

      <!-- 5 Parts Stepper -->
      <nav id="partStepper" class="part-stepper" aria-label="Assessment parts"></nav>

      <div class="progress-info">
        <span id="progressText">Progress: 0 / 60 answered</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
    </header>

    <!-- Current Part Header Banner -->
    <div id="partBanner" class="part-banner"></div>

    <!-- 12 Question Cards for the Active Part -->
    <section id="questionsContainer" class="questions-list"></section>

    <!-- Helpful reminder if a question in this part is skipped -->
    <p id="partAlert" class="part-alert" role="alert" hidden></p>

    <!-- Part Navigation -->
    <div class="quiz-nav">
      <button id="prevBtn" class="btn-prev" type="button" hidden>
        <span class="prev-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </span>
        <span>Previous Part</span>
      </button>

      <button id="nextBtn" class="btn-start-gradient btn-next" type="button">
        Next Part &rarr;
      </button>

      <button id="submitQuizBtn" class="btn-start-gradient" type="button" hidden>
        Complete &amp; View Results &rarr;
      </button>
    </div>
  </main>

  <script src="./scripts/questions.js"></script>
  <script src="./scripts/quiz.js"></script>
</body>

</html>
